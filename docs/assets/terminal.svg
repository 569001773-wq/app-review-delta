<text x="18" y="1806" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#58a6ff" font-weight="600">INFO · ARD007</text>
<text x="18" y="1826" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#c9d1d9">Review-sensitive SDK added (tracking)</text>
<text x="18" y="1846" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#c9d1d9"></text>
<text x="18" y="1866" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#c9d1d9">package.json</text>
