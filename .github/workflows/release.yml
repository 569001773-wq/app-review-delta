name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run bundle:action
      - name: Commit the freshly built bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/action
          git diff --cached --quiet || git commit -m "build: bundle action for $GITHUB_REF_NAME"
          git push
      - name: Move the v1 major tag
        run: |
          git tag -f v1
          git push origin v1 --force
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes
      - name: Reminder for Marketplace publishing
        run: |
          echo "To publish to GitHub Marketplace: edit the release, tick
          'Publish this Action to the GitHub Marketplace', choose a category,
          and save. This requires the GitHub Marketplace Developer Agreement
          and two-factor authentication (owner-only UI step)."
